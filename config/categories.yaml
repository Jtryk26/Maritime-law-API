# =============================================================================
# Maritim taksonomi — konfiguration
# =============================================================================
# Styrer KeywordCategorizationEngine og seeding af `categories`-tabellen.
# Et dokument kan tilhøre flere kategorier.
#
# Matchning og feltvægte fungerer som i maritime_keywords.yaml.
# Confidence beregnes pr. kategori som:  raw / (raw + saturation)  -> 0.0–1.0
# Kategorien tildeles hvis confidence >= min_confidence.
# =============================================================================

version: 1

scoring:
  field_weights:
    title: 3.0
    authority: 1.2
    metadata: 1.5
    content: 1.0
  max_occurrences_per_term_per_field: 3
  saturation: 12.0

  # Kategorier under denne tærskel tildeles ikke.
  # Sat forholdsvis højt: en kategori skal være reelt beskrivende for
  # dokumentet, ikke blot strejfet af et enkelt generisk ord.
  min_confidence: 0.55

  # Højst N kategorier pr. dokument (de stærkeste vinder).
  max_categories_per_document: 4

# Tildeles hvis dokumentet er maritimt, men ingen kategori nåede tærsklen.
fallback_category: andet-maritimt

