# =============================================================================
# Geografisk gazetteer — kuraterede områder
# =============================================================================
# Seeder `geographic_areas` og styrer navnegenkendelsen i
# app.services.geography. Se docs/GEOGRAPHIC_MAP_FEATURE.md.
#
# VIGTIGT
#   * Ingen juridiske grænser er tegnet her. `indicative_point` er et
#     omtrentligt kortmærke [længde, bredde] til visning — IKKE en grænse.
#     Officielle polygoner indlæses separat med
#     `python -m app.cli geography load-geometry` og kilden angives.
#   * `legal_status: curated_unverified` betyder, at metadata (hjemmel,
#     datoer) er indtastet efter bedste viden og SKAL efterprøves mod den
#     officielle tekst (IMO/MARPOL, HELCOM, lovgivning) før den bruges.
#
# Felter
#   slug             stabil nøgle — ændres aldrig
#   name / name_da   visningsnavne
#   area_type        global | sea_area | strait | territorial_waters | state
#                    | marpol_special_area | eca | pssa | routeing_measure
#                    | polar_waters
#   aliases          navne, der genkendes i tekst (dansk og engelsk).
#                    Matchning er uafhængig af store/små bogstaver og æ/ae.
#                    Danske bøjningsendelser (-en, -ens, -s, -et) tillades.
#   mention_only     true: et fund kan højst klassificeres som MENTIONS.
#                    Bruges for stater, hvor "Danmark" oftest er flagstat,
#                    ikke farvand.
#   weight           0–1, ganges på confidence. Lav for tvetydige navne.
#   parent           slug på et overordnet område (kun metadata).
# =============================================================================

