# =============================================================================
# Maritim relevansvurdering — konfiguration
# =============================================================================
# Denne fil styrer KeywordRelevanceEngine. Ingen af disse termer er hardcodet
# i applikationskoden. Tilføj frit nye termer, vægte og begreber.
#
# Tekst og termer foldes før matchning (æ→ae, ø→oe, å→aa, små bogstaver),
# så "SØFART" og "søfart" matcher konsistent.
#
# Felt: match
#   word      — hele ord (standard). "lods" matcher IKKE "lodsejer".
#   prefix    — ordet som præfiks. "skib" matcher "skibe", "skibsfører".
#   substring — hvor som helst i teksten. Bruges til flerordsudtryk.
#   regex     — eget regulært udtryk i feltet `pattern`.
#
# Felt: concept
#   Bruges til bonus for uafhængige maritime begreber. Et dokument der kun
#   nævner "skib" mange gange får IKKE bonus. Et dokument der nævner både
#   skib, besætning og miljø dækker flere begreber og får bonus.
# =============================================================================

version: 1

scoring:
  # Vægt pr. felt. Titel vejer tungest, brødtekst mindst.
  field_weights:
    title: 3.0
    authority: 2.5
    metadata: 1.5      # dokumenttype, korttitel, nøgleord, ressort
    content: 1.0

  # Anti-spam: samme term tæller højst N gange pr. felt.
  # Forhindrer at 500 gentagelser af "skib" giver maksimal score.
  max_occurrences_per_term_per_field: 3

  # Bonus for hvert uafhængigt maritimt begreb ud over det første.
  bonus_per_extra_concept: 4.0
  max_concept_bonus: 20.0

  # Rå score normaliseres til 0–100 med en mættende funktion:
  #   score = 100 * raw / (raw + saturation)
  # Højere saturation => sværere at opnå høj score.
  saturation: 45.0

  # Titelautoritet.
  # Står en utvetydig maritim term i titlen — "passagerskib", "SOLAS",
  # "søfarende" — er dokumentet maritimt, uanset hvor kort teksten er.
  # Titlen er lovgivers egen emneangivelse og det stærkeste enkeltsignal
  # vi har. Uden denne regel ville et dokument med kort eller manglende
  # brødtekst kunne falde under tærsklen alene på grund af tekstlængde.
  #
  # Reglen sætter et GULV for scoren, ikke en fast værdi, så stærkere
  # dokumenter stadig scorer højere. Gulvet anvendes ikke, hvis titlen
  # samtidig indeholder en negativ term (f.eks. "skibsfart og luftfart").
  decisive_title_min_weight: 8.0
  decisive_title_floor_score: 70

thresholds:
  # 0–29   -> ikke maritimt
  # 30–59  -> mulig maritim relevans
  # 60–100 -> maritimt
  maritime: 60
  possible: 30

# Termer der trækker scoren NED. Dæmper falske positiver, f.eks. luftfart
# der også taler om "fartøjer" og "besætning".
