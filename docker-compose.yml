# =============================================================================
# Maritim Lovdatabase — lokalt udviklingsmiljø
# =============================================================================
#   docker compose up --build
#
# Starter:
#   db        PostgreSQL 16 med dansk fuldtekstsøgning og pgvector
#   backend   FastAPI. Kører Alembic-migrationer og seeder kategorier ved opstart.
#   frontend  Vite-build serveret af nginx, med proxy til backend.
#
# Frontend:  http://localhost:8080
# API-docs:  http://localhost:8000/docs
#
# PORTBINDING
# Alle porte bindes til 127.0.0.1 som standard. Tjenesterne taler sammen
# over Docker-netværket og har ikke brug for at være synlige på LAN'et,
# og databaseporten skal under ingen omstændigheder ud af maskinen.
# Sæt BIND_ADDRESS=0.0.0.0 i .env, hvis du bevidst vil tilgå systemet fra
# en anden maskine på dit eget net.
#
# OFFENTLIG ADGANG
# Skal systemet på internettet, sker det gennem Cloudflare Tunnel — ikke
# ved at åbne porte i routeren:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
# Se docs/deployment-cloudflare-tunnel.md.
#
# Databasen er tom efter første opstart. Kør en import fra "Import og drift"
# i brugerfladen, eller:
#   docker compose exec backend python -m app.cli import --source production
#
# Vektorindekset bygges bagefter — bevidst adskilt fra importen:
#   docker compose exec backend python -m app.cli embed run
#   docker compose exec backend python -m app.cli embed status
# =============================================================================

services:
  db:
    # Det officielle pgvector-image er Debian-baseret og har ikke dansk
    # locale genereret. Den eksisterende databaseklynge blev oprettet med
    # da_DK.utf8; database/Dockerfile tilføjer derfor netop den locale uden
    # at ændre PostgreSQL-version, pgvector eller datavolumen.
    build:
      context: .
      dockerfile: database/Dockerfile
    image: maritime-law-api-db
    container_name: maritim-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maritim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maritim}
      POSTGRES_DB: ${POSTGRES_DB:-maritim}
      # Dansk locale, så to_tsvector('danish', ...) sorterer og
      # stammer korrekt.
      LANG: da_DK.utf8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Kun loopback. En PostgreSQL på 0.0.0.0:5432 med standardkodeord er
      # den korteste vej til et kompromitteret system.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Backend venter på at databasen faktisk tager imod forbindelser,
      # ikke blot på at containeren er startet.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maritim} -d ${POSTGRES_DB:-maritim}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maritim-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maritim}:${POSTGRES_PASSWORD:-maritim}@db:5432/${POSTGRES_DB:-maritim}
      # Migrationerne køres automatisk, så ingen skal oprette tabeller manuelt.
      RUN_MIGRATIONS_ON_STARTUP: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Vælges bevidst. Der falder aldrig automatisk tilbage til fixture.
      SOURCE_CLIENT: ${SOURCE_CLIENT:-production}
      RETSINFORMATION_BASE_URL: ${RETSINFORMATION_BASE_URL:-https://api.retsinformation.dk}
      RETSINFORMATION_DOCUMENT_BASE_URL: ${RETSINFORMATION_DOCUMENT_BASE_URL:-https://www.retsinformation.dk}
      RETSINFORMATION_SEARCH_URL: "${RETSINFORMATION_SEARCH_URL:-}"
      RETSINFORMATION_SEARCH_METHOD: "${RETSINFORMATION_SEARCH_METHOD:-POST}"
      RETSINFORMATION_SEARCH_PARAMS: "${RETSINFORMATION_SEARCH_PARAMS:-}"
      RETSINFORMATION_SEARCH_PAGE_SIZE: "${RETSINFORMATION_SEARCH_PAGE_SIZE:-100}"
      RETSINFORMATION_SEARCH_PAGINATION: "${RETSINFORMATION_SEARCH_PAGINATION:-page}"
      RETSINFORMATION_SEARCH_FIRST_PAGE: "${RETSINFORMATION_SEARCH_FIRST_PAGE:-0}"
      RETSINFORMATION_SEARCH_MAX_PAGES: "${RETSINFORMATION_SEARCH_MAX_PAGES:-200}"
      RETSINFORMATION_SEARCH_MIN_REQUEST_INTERVAL_SECONDS: "${RETSINFORMATION_SEARCH_MIN_REQUEST_INTERVAL_SECONDS:-2}"
      IMPORT_STORE_MIN_SCORE: ${IMPORT_STORE_MIN_SCORE:-30}
      # --- Semantisk søgning ---
      # Modellen ligger i imaget (se backend/Dockerfile), så containeren
      # kan vektorisere uden netværk og uden API-nøgle.
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      SENTENCE_TRANSFORMERS_HOME: /models
      SEARCH_DEFAULT_MODE: ${SEARCH_DEFAULT_MODE:-hybrid}
      SEARCH_QUERY_LOG_ENABLED: ${SEARCH_QUERY_LOG_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # --- Adgangskontrol ---
      # Beskytter POST /api/import/run, POST /api/embeddings/run,
      # importhistorik, nøgletal og søgelog. Er den tom, svarer de
      # endepunkter 503 — de står altså aldrig åbne ved et uheld.
      # Generér et token: docker compose run --rm backend python -m app.cli admin-token
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # --- Rate limiting ---
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-30}
      # nginx står altid foran backenden i denne opsætning, så
      # X-Forwarded-For og CF-Connecting-IP kommer fra en proxy vi selv
      # kontrollerer og kan bruges til at identificere klienten.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # /docs og /openapi.json. Slås fra i tunnel-opsætningen.
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
    ports:
      # Backenden nås normalt gennem nginx på frontend-porten. Bindingen
      # her er til udvikling og fejlsøgning fra selve værtsmaskinen.
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Konfigurationen kan justeres uden at bygge imaget om.
      - ./config:/config:ro
      - ./data/fixtures:/data/fixtures:ro
      - ./manifests:/manifests
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: maritim-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
