# Standardseed til Vessel Applicability 2.0.
#
# Indeholder kun regler, hvis retsakt høstes fra Retsinformation og derfor kan
# efterprøves ordret. Regler fra Meddelelser fra Søfartsstyrelsen B seedes ikke,
# før høsteren for Søfartsstyrelsens forskrifter er implementeret og efterprøvet.
#
# BEK nr. 846 af 25/06/2018 om sikkerhedsarbejde i handelsskibe (gældende;
# afløste BEK nr. 863 af 27/06/2017, som er historisk). § 3, stk. 1 er
# grundreglen for alle handelsskibe; § 4 gælder kun lastskibe.
#
# Udløseren er den FASTSATTE besætning inkl. skibsføreren (prescribed_crew_count),
# ikke de faktisk ansatte (actual_crew_count) og ikke køjekapaciteten.
#
# FØR GODKENDELSE — kontrollér i den høstede tekst:
