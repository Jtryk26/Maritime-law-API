server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    # Statiske aktiver har indholdshash i filnavnet og kan caches længe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API-kald sendes videre til backend, så browseren kun taler med én oprindelse.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # En import kan tage tid, når kilden har rate limit.
        proxy_read_timeout 600s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Hash-baseret routing i frontenden — alt andet serveres af index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
