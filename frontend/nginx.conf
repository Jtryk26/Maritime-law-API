# =============================================================================
# Frontend + API-proxy
# =============================================================================
# Filen lægges i /etc/nginx/conf.d/ og inkluderes altså i http-konteksten.
# Derfor kan limit_req_zone stå her, uden for server-blokken.
# =============================================================================

# Rate limiting-nøgle.
#
# Bag Cloudflare Tunnel er $binary_remote_addr adressen på cloudflared-
# containeren — den er ens for alle brugere, og en zone på den ville
# lukke hele skolen ude, så snart én person søgte hurtigt. Cloudflare
# sender den oprindelige adresse i CF-Connecting-IP; den bruges når den
# findes, ellers falder vi tilbage til socket-adressen (direkte adgang
# fra det lokale net).
map $http_cf_connecting_ip $maritim_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 10 MB rummer i størrelsesordenen 160.000 adresser.
# Grænserne skal svare til RATE_LIMIT_* i backendens miljø.
limit_req_zone $maritim_client zone=maritim_api:10m    rate=120r/m;
limit_req_zone $maritim_client zone=maritim_search:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Skjul nginx-version i Server-headeren og på fejlsider.
    server_tokens off;

    # Et søgeord fylder ikke meget. Loftet stopper store POST-kroppe,
    # før de når applikationen.
    client_max_body_size 256k;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    # Et afvist kald skal se ud som ethvert andet API-svar. Uden dette
    # svarer nginx med sin egen HTML-fejlside, og brugerfladen — som
    # forventer JSON med `detail` og `error_type` — ville vise rå
    # markup i stedet for "prøv igen om lidt".
    error_page 429 @ratelimited;

    location @ratelimited {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        add_header Retry-After 30 always;
        return 429 '{"detail":"For mange forespørgsler. Prøv igen om et øjeblik.","error_type":"rate_limited"}';
    }

    # Statiske aktiver har indholdshash i filnavnet og kan caches længe.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # --- Søgning -------------------------------------------------------------
    # Egen zone, fordi en søgning er dyrere end et opslag: den rammer både
    # fuldtekstindekset og — i hybridtilstand — embedding-modellen.
    # burst tillader den naturlige klynge af kald, når en side loader.
    location /api/search {
        include /etc/nginx/security-headers.conf;
        limit_req zone=maritim_search burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    # --- Øvrige API-kald -----------------------------------------------------
    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=maritim_api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # En import kan tage tid, når kilden har rate limit.
        proxy_read_timeout 600s;
    }

    # Backendens OpenAPI-flader proxies bevidst ikke. De er kun
    # tilgængelige på backendens egen port, som ikke publiceres udadtil,
    # og slås desuden fra med EXPOSE_API_DOCS=false i produktion.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Hash-baseret routing i frontenden — alt andet serveres af index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
