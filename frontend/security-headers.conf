# Sikkerhedsheadere.
#
# Ligger i sin egen fil, fordi nginx' `add_header` ikke nedarves til en
# location, der selv sætter headere. Filen inkluderes derfor eksplicit i
# hver location frem for kun i server-blokken — ellers ville netop
# /assets/ stå uden dem.
#
# `always` sikrer at headerne også sendes på fejlsvar (429, 502).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy.
#
# 'unsafe-inline' i style-src er nødvendigt: React-komponenterne bruger
# style-attributter, og de tæller som inline styles. script-src er
# derimod stram — ingen inline scripts, ingen eval.
#
# connect-src 'self': browseren må kun kalde vores eget API. Skulle en
# fremtidig version hente noget udefra, skal domænet tilføjes her.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
